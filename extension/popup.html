<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:340px;background:#0f1218;color:#eef1f7;font:13px/1.45 "Segoe UI",system-ui,sans-serif;padding:14px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  header img{width:28px;height:28px;border-radius:8px}
  header b{font-size:16px}
  header span{margin-left:auto;font-size:11px;color:#8a93a8}
  .site{font-size:12px;color:#8a93a8;margin-bottom:8px}
  .site b{color:#eef1f7}
  .row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:#151922;margin-bottom:6px}
  .av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,#10b981,#65c94a);flex:none}
  .t{min-width:0;flex:1}.t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t span{color:#8a93a8;font-size:12px}
  button{font:inherit;color:#fff;border:none;border-radius:8px;padding:7px 12px;cursor:pointer;background:linear-gradient(135deg,#10b981,#65c94a);font-weight:600}
  button.ghost{background:#1b2030;color:#cfd5e3;font-weight:400}
  input{width:100%;font:inherit;color:#eef1f7;background:#151922;border:1px solid #2a3142;border-radius:9px;padding:9px 10px;outline:none;margin:4px 0 8px}
  input:focus{border-color:#10b981}
  .code{font:600 22px Consolas,monospace;letter-spacing:.35em;text-align:center}
  .msg{color:#aeb6c8;padding:6px 2px}
  .warn{color:#fbbf24;font-size:12px;padding:2px 2px 8px}
  .err{color:#ff6b81;min-height:16px;font-size:12px}
  .sec{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#8a93a8;margin:12px 0 6px}
  footer{display:flex;justify-content:space-between;margin-top:10px}
  a{color:#34d399;cursor:pointer}
</style></head>
<body>
<header><img src="icons/icon48.png"><b>Keystead</b><span id="state"></span></header>
<div id="main"><div class="msg">Connecting…</div></div>
<script src="popup.js"></script>
</body></html>
